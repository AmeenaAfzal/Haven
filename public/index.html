<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haven</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --paper:#F6F3EA; --wall:#DCE3D2; --wall-deep:#C3CEB4;
    --walnut:#6B4A34; --walnut-deep:#4A3223;
    --plum:#6E3B4F; --plum-deep:#532C3C;
    --ochre:#C08A3E; --gold:#D9A441; --silver:#9AA3A0; --bronze:#B07A4E;
    --ink:#2E2B26; --ink-soft:#5B5648; --line:#C3CEB4;
    --danger:#A3432F; --danger-bg:#F1DFD6;
    --success:#4C7A5B; --success-bg:#DCE8DE;
    --radius-door: 28px 28px 6px 6px;
    --shadow-soft: 0 6px 18px rgba(43,42,38,0.10);
  }
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;} }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--wall);color:var(--ink);font-family:'Inter',sans-serif;font-size:17px;line-height:1.5;min-height:100vh;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;color:var(--walnut-deep);font-weight:600;margin:0 0 0.4em 0;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{outline:3px solid var(--ochre);outline-offset:2px;}
  a{color:var(--plum);}

  #app{max-width:980px;margin:0 auto;min-height:100vh;padding-bottom:60px;}
  .mantel{background:var(--walnut);color:var(--paper);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;border-bottom:6px solid var(--walnut-deep);}
  .wordmark{font-family:'Fraunces',serif;font-weight:700;font-size:26px;letter-spacing:0.5px;color:var(--paper);display:flex;align-items:center;gap:10px;}
  .wordmark small{font-family:'Inter',sans-serif;font-weight:500;font-size:12px;color:var(--wall);opacity:0.85;letter-spacing:0.4px;}
  .role-tag{font-size:11.5px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;background:var(--ochre);color:var(--walnut-deep);padding:3px 9px;border-radius:999px;}
  nav.doors{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  nav.doors button{background:var(--walnut-deep);color:var(--paper);border:none;padding:10px 15px;border-radius:14px 14px 4px 4px;font-size:13.5px;font-weight:600;min-height:40px;}
  nav.doors button.active{background:var(--ochre);color:var(--walnut-deep);}
  nav.doors button:hover{background:var(--plum);color:#fff;}
  .switch-btn{background:transparent !important;border:1.5px solid var(--wall) !important;color:var(--wall) !important;font-size:12.5px !important;padding:8px 12px !important;}

  main{padding:26px 24px;}
  .card{background:var(--paper);border-radius:16px;padding:22px;box-shadow:var(--shadow-soft);border:1px solid var(--line);}
  .door-card{background:var(--paper);border-radius:var(--radius-door);padding:20px 22px;box-shadow:var(--shadow-soft);border:1px solid var(--line);border-top:3px solid var(--ochre);}

  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}

  .muted{color:var(--ink-soft);font-size:15px;}
  .small{font-size:13.5px;}

  .quiz-option.wrong{background:var(--danger-bg);border-color:var(--danger);}

  .lb-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:12px;background:#fff;border:1.5px solid var(--line);margin-bottom:8px;}
  .lb-rank{font-family:'Fraunces',serif;font-weight:700;font-size:17px;width:24px;text-align:center;color:var(--walnut-deep);}
  .lb-medal{font-size:19px;width:22px;text-align:center;}

  .lb-score{font-weight:700;color:var(--plum);}
  .lb-row.rank1{background:linear-gradient(90deg,#FBF0D6,#fff);border-color:var(--gold);}
  .lb-row.rank2{background:linear-gradient(90deg,#EDEFEC,#fff);border-color:var(--silver);}
  .lb-row.rank3{background:linear-gradient(90deg,#F3E3D3,#fff);border-color:var(--bronze);}

  .post-card{border-bottom:1px solid var(--line);padding:16px 0;}
  .post-photo{width:100%;max-width:320px;max-height:320px;object-fit:cover;border-radius:12px;margin:8px 0;display:block;box-shadow:var(--shadow-soft);border:1px solid var(--line);}
  .photo-upload-label{display:inline-flex;align-items:center;gap:6px;}
  .photo-preview-wrap{position:relative;display:inline-block;margin-top:8px;}
  .photo-remove-btn{position:absolute;top:8px;right:8px;background:var(--walnut-deep);color:#fff;border:none;border-radius:50%;width:28px;height:28px;min-height:28px;padding:0;font-size:14px;line-height:1;}
  .react-btn{background:none;border:1.5px solid var(--wall-deep);border-radius:999px;padding:6px 14px;font-size:14px;min-height:36px;}
  .react-btn.on{background:var(--danger-bg);border-color:var(--danger);color:var(--danger);}
  .toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:1000;max-width:520px;width:calc(100% - 32px);}
  .toast{border-radius:14px;padding:14px 18px;font-size:15px;box-shadow:var(--shadow-soft);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .toast-info{background:#fff;border:1.5px solid var(--wall-deep);color:var(--ink);}
  .toast-success{background:var(--success-bg);border:1.5px solid var(--success);color:var(--success);}
  .toast-error{background:var(--danger-bg);border:1.5px solid var(--danger);color:var(--danger);}
  .toast-close{background:none;border:none;font-size:19px;cursor:pointer;color:inherit;padding:0;min-height:auto;line-height:1;flex-shrink:0;}

  .modal-overlay{position:fixed;inset:0;background:rgba(43,42,38,0.45);display:flex;align-items:center;justify-content:center;z-index:1100;padding:20px;}
  .modal-card{background:var(--paper);border-radius:var(--radius-door);padding:24px;max-width:420px;width:100%;box-shadow:var(--shadow-soft);border-top:3px solid var(--ochre);}
</style>

<div id="app"></div>

<script>
/* =========================================================================
   HAVEN — hackathon demo build
   Single-file, no backend. All data lives in memory for this session.

   SAFETY FILTER NOTE: classifyMessage() calls a local backend at
   /api/classify (see haven-server/server.js), which uses OpenAI's free
   moderation endpoint plus one short gpt-5.4-nano classification call. If
   that server isn't running, or has no API key configured, the call fails
   fast and classifyMessage() falls back to classifyMessageLocal(), a
   keyword-based demo filter, so the app never breaks — it just quietly
   loses AI accuracy. Check the browser console to see which path was used.
   Direct moderator/admin messages are NOT run through this filter on
   purpose — that channel exists so someone can safely describe exactly
   what a scammer or bad actor said to them.

   QUIZ GENERATION NOTE: generateModQuiz() calls /api/quiz on the same
   backend, which asks OpenAI to generate 5 questions for the given theme.
   Same fallback behavior applies if the server or key isn't available: it
   drops back to a small pre-written question bank instead of failing.
   ========================================================================= */

const ADMIN_PASSWORD = 'haven-admin-2026';
let uid = 1;
const nextId = () => uid++;

const NUDGE_PROMPTS = [
  "What's one small thing that helped you today?",
  "Has anyone found something that made a hard day a little easier lately?",
  "What's something you're looking forward to this week, big or small?",
  "Who or what made you smile recently?"
];
const CRISIS_MESSAGE = "This did not post to the room. If things feel like too much right now, you are not alone in this. Please reach out to a crisis line in your area (in the US, call or text 988). Would you like to message a moderator instead?";
const SCAM_MESSAGE = "This message was not posted. It looks like it might involve sending money or personal details, which Haven does not allow. If someone asked you for this, please tell a moderator.";
const TOXIC_MESSAGE = "This message was not posted. Want to rephrase it?";

function classifyMessageLocal(text){
  const t = text.toLowerCase();
  const scamWords = ['wire transfer','gift card','send money','bank account','routing number','venmo me','click this link','confirm your ssn','social security number','western union','cash app me','pay me back first'];
  const crisisWords = ['want to die','end it all',"can't go on",'no reason to live','kill myself','not worth living','better off without me'];
  const toxicWords = ['shut up','idiot','stupid','worthless','you people','hate you'];
  if(scamWords.some(w=>t.includes(w))) return {type:'scam', message:SCAM_MESSAGE};
  if(crisisWords.some(w=>t.includes(w))) return {type:'crisis', message:CRISIS_MESSAGE};
  if(toxicWords.some(w=>t.includes(w))) return {type:'toxic', message:TOXIC_MESSAGE};
  return {type:'ok'};
}
function labelToResult(label){
  if(label==='scam') return {type:'scam', message:SCAM_MESSAGE};
  if(label==='crisis') return {type:'crisis', message:CRISIS_MESSAGE};
  if(label==='toxic') return {type:'toxic', message:TOXIC_MESSAGE};
  return {type:'ok'};
}
async function classifyMessage(text){
  try{
    const res = await fetch('/api/classify', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({text})
    });
    if(!res.ok) throw new Error('server responded with ' + res.status);
    const data = await res.json();
    return labelToResult(data.label);
  } catch(err){
    console.warn('AI classifier unavailable (is the local server running with a valid key?) — using the local demo filter instead:', err.message);
    return classifyMessageLocal(text);
  }
}

const CHIP_OPTIONS = ['Chronic pain','Fibromyalgia','Arthritis','Lupus','Caregiving','Just want to talk','General loneliness'];
const EVENT_TAGS = ['Session','Competition','Social','Class','Walk'];
const DM_TOPICS = [
  {id:'issue', label:"There's an issue, or I'm uncomfortable", priority:true, reply:"Thanks for letting me know. I will look into this as a priority and follow up with you here."},
  {id:'talk', label:"I just want to talk", priority:false, reply:"Glad you reached out. Tell me a bit about what's on your mind, no rush at all."},
  {id:'event', label:"I have a question about an event", priority:false, reply:"Happy to help with the event. What would you like to know?"},
  {id:'other', label:"Something else", priority:false, reply:"Thanks for reaching out. I will get back to you shortly."}
];
const MOD_GENERATION_TEMPLATES = [
  {label:'General Knowledge Extra', qs:[
    {q:"Which season comes right after winter?", options:["Summer","Spring","Autumn","Monsoon"], answer:1},
    {q:"What do bees produce?", options:["Milk","Honey","Silk","Wax only"], answer:1},
    {q:"Which meal is typically eaten in the morning?", options:["Breakfast","Lunch","Dinner","Supper"], answer:0},
    {q:"How many pieces does one side start with in chess?", options:["8","12","16","32"], answer:2},
    {q:"Which of these is a common Indian bread?", options:["Chapati","Baguette","Tortilla","Pita"], answer:0}
  ]},
  {label:'Memory Lane', qs:[
    {q:"Which of these was common for calling from outside home before mobile phones?", options:["Telegram","Landline booth","Fax","Pager only"], answer:1},
    {q:"Which format was commonly used to record TV shows before DVDs?", options:["VHS tape","Blu-ray","USB drive","SD card"], answer:0},
    {q:"Which of these is a traditional Indian musical instrument?", options:["Sitar","Synthesizer","Electric guitar","Drum machine"], answer:0},
    {q:"What did people traditionally use to send letters?", options:["Email","Postal mail","SMS","Video call"], answer:1},
    {q:"What was a common way to keep family photos before digital cameras?", options:["Photo albums","Cloud storage","Social media","USB drives"], answer:0}
  ]}
];

/* generates an on-brand placeholder photo (SVG data URI) for seed/demo posts,
   so seeded content renders through the exact same <img> path as a real
   member upload instead of a separate boolean "has a photo" flag */
function demoPhotoDataUrl(label){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200">
    <rect width="320" height="200" fill="#DCE3D2"/>
    <rect x="10" y="10" width="300" height="180" fill="none" stroke="#C08A3E" stroke-width="3"/>
    <text x="160" y="104" font-family="Georgia, serif" font-size="15" fill="#4A3223" text-anchor="middle">${escapeHtml(label)}</text>
  </svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

/* ---------------- state ---------------- */
const state = {
  screen: 'roleSelect',
  role: null,
  name: '',
  intake: { about:'', chips:[], start:'' },
  userProfiles: {}, // name -> {intake}

  currentRoomId: null,
  roomTab: 'chat',
  memberSearch: '',

  modRoomId: null,
  modTab: 'chat',
  adminTab: 'applications',

  eventsTab: 'upcoming',
  eventTagFilter: [],

  applyRoomId: null,
  createRoomTags: [],
  roomSearchQuery: '',

  dmRoomId: null,

  reportFlow: null,       // {roomId, target, step:'form'|'confirm', reason}
  kickFlow: null,         // {roomId, target, step:'form'|'confirm', reason} — replaces window.prompt for kick reason
  toast: null,            // {id, type, message} — replaces window.alert
  confirmModal: null,     // {title, message, confirmLabel, cancelLabel, onConfirm} — replaces window.confirm
  customTags: [],         // tags added by users when creating a room, merged with CHIP_OPTIONS everywhere tags are picked
  reportedPairs: [],      // "reporter|target|roomId"
  flaggedByMe: [],        // "reporter|messageId"

  quiz: { theme:null, index:0, score:0, finished:false, answered:false },

  rooms: [
    {id:'fibro', name:'Fibromyalgia Circle', tags:['Fibromyalgia'], region:'Kochi',
      desc:"A room for people living with fibromyalgia to talk about good days and hard ones.",
      members:['Radha','Thomas K.'], moderators:['Thomas K.'],
      messages:[{who:'Radha', text:"Slept badly again but the heating pad is helping today."},{who:'Thomas K.', text:"Same boat. Glad you're here."}], msgCount:2, kickLog:[]},
    {id:'arthritis', name:'Arthritis & Joint Pain', tags:['Arthritis'], region:'Kochi',

/* assign stable ids to every seed message so flag-dedupe works from the start */
state.rooms.forEach(r => r.messages.forEach(m => { if(m.id===undefined) m.id = nextId(); }));

/* ---------------- helpers ---------------- */
function h(){ return document.getElementById('app'); }
function go(screen){ state.screen = screen; render(); window.scrollTo(0,0); }
function room(id){ return state.rooms.find(r=>r.id===id); }
function event_(id){ return state.events.find(e=>e.id===id); }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pairKey(a,b,c){ return a+'|'+b+'|'+c; }

function showToast(message, type, durationMs){
  type = type || 'info';
  durationMs = durationMs || 4500;
  const id = nextId();
  state.toast = {id, type, message};
  render();
  setTimeout(()=>{ if(state.toast && state.toast.id===id){ state.toast=null; render(); } }, durationMs);
}
function dismissToast(){ state.toast=null; render(); }

function showConfirm(title, message, onConfirm, confirmLabel, cancelLabel){
  state.confirmModal = {title, message, onConfirm, confirmLabel: confirmLabel||'Confirm', cancelLabel: cancelLabel||'Cancel'};
  render();
}
function runConfirmModal(){
  const cb = state.confirmModal && state.confirmModal.onConfirm;
  state.confirmModal = null;
  if(typeof cb === 'function') cb();
  render();
}
function cancelConfirmModal(){
  const cb = state.confirmModal && state.confirmModal.onCancel;
  state.confirmModal = null;
  if(typeof cb === 'function') cb();
  render();
}

function toastMarkup(){
  if(!state.toast) return '';
  return `<div class="toast-wrap"><div class="toast toast-${state.toast.type}">
    <span>${escapeHtml(state.toast.message)}</span>
    <button class="toast-close" onclick="dismissToast()" aria-label="Dismiss">×</button>
  </div></div>`;
}
function confirmModalMarkup(){
  if(!state.confirmModal) return '';
  const cm = state.confirmModal;
  return `<div class="modal-overlay"><div class="modal-card">
    <h3>${escapeHtml(cm.title)}</h3>
    <p class="muted">${escapeHtml(cm.message)}</p>
    <div class="row" style="justify-content:flex-end;margin-top:16px;">
      <button class="btn btn-secondary" onclick="cancelConfirmModal()">${escapeHtml(cm.cancelLabel)}</button>
      <button class="btn btn-primary" onclick="runConfirmModal()">${escapeHtml(cm.confirmLabel)}</button>
    </div></div></div>`;
}

function reconcileStaleModeratorFlags(){
  state.flaggedModerators.forEach(m=>{
    if(m.status==='open'){
      const r = room(m.roomId);
      if(!r || !r.moderators.includes(m.name)) m.status = 'resolved';
    }
  });
}

function modStatus(roomId, name){
  const r = room(roomId);
  if(r.moderators.includes(name)) return 'is_mod';
  const app = state.moderatorApplications.find(a=>a.applicantName===name && a.roomId===roomId && a.status==='pending');
  if(app) return 'pending';
  if(r.moderators.length>=2) return 'full';
  return 'none';
}

/* ================= HEADER ================= */
function header(){
  const loginScreens = ['roleSelect','userLogin','modLogin','adminLogin','onboarding1','onboarding2','onboarding3'];
  if(loginScreens.includes(state.screen)){
    return `<div class="mantel"><div class="wordmark">Haven <small ><em><strong>a small place to be known</strong></em></small></div></div>`;
  }
  let nav = '', roleTag = '';
  if(state.role==='user'){
    roleTag = `<span class="role-tag">User: ${state.name}</span>`;
    nav = `<button class="${state.screen==='home'?'active':''}" onclick="go('home')">Home</button>
      <button class="${state.screen==='rooms'?'active':''}" onclick="go('rooms')">Rooms</button>
      <button class="${state.screen==='events'?'active':''}" onclick="go('events')">Events</button>
      <button class="${state.screen==='quiz'?'active':''}" onclick="go('quiz')">Quiz</button>`;
  } else if(state.role==='moderator'){
    roleTag = `<span class="role-tag">Moderator: ${state.name} — ${room(state.modRoomId)?room(state.modRoomId).name:''}</span>`;
    nav = `<button class="${state.screen==='modDashboard'?'active':''}" onclick="go('modDashboard')">Moderator dashboard</button>`;
  } else if(state.role==='admin'){
    roleTag = '<span class="role-tag">Admin</span>';
    nav = `<button class="${state.screen==='adminDashboard'?'active':''}" onclick="go('adminDashboard')">Admin dashboard</button>`;
  }
  return `<div class="mantel"><div class="wordmark">Haven <small>a small place to be known</small></div>
    <div class="row">${roleTag}<nav class="doors">${nav}</nav>
      <button class="switch-btn btn-sm" onclick="switchRole()">Switch role / Log out</button></div></div>`;
}
function switchRole(){
  state.role=null; state.name=''; state.modRoomId=null; state.currentRoomId=null; state.reportFlow=null;
  go('roleSelect');
}
function footer(){
  return `<footer class="note"><em>"Where every voice is valued, and no one walks alone."</em></footer>`;
}
function render(){
  reconcileStaleModeratorFlags();
  const views = {
    roleSelect: viewRoleSelect, userLogin: viewUserLogin, modLogin: viewModLogin, adminLogin: viewAdminLogin,
    onboarding1: viewOnboarding1, onboarding2: viewOnboarding2, onboarding3: viewOnboarding3,
    home: viewHome, rooms: viewRooms, createRoom: viewCreateRoom, applyModerate: viewApplyModerate,
    room: viewRoom, events: viewEvents, quiz: viewQuiz, dmTopic: viewDmTopic, dmChat: viewDmChat,
    modDashboard: viewModDashboard, adminDashboard: viewAdminDashboard
  };
  const fn = views[state.screen] || viewRoleSelect;
  h().innerHTML = toastMarkup() + confirmModalMarkup() + header() + `<main>${fn()}</main>` + footer();
}

function dots(n,total){ let s='<div class="progress-dots">'; for(let i=1;i<=total;i++) s+=`<span class="${i<=n?'on':''}"></span>`; return s+'</div>'; }

function addCustomTag(){

function submitCreateRoom(){

/* ================= ROOM (chat + members) ================= */
function viewRoom(){
  const r = room(state.currentRoomId);
  if(!r) return `<p>Room not found. <button class="btn btn-secondary" onclick="go('home')">Back home</button></p>`;
  const showNudge = r.msgCount>0 && r.msgCount % 6 === 0 && !r._nudgeShownFor;
  const nudgeText = NUDGE_PROMPTS[Math.floor(r.msgCount/6) % NUDGE_PROMPTS.length];
  return `<div class="stack"><div class="room-window">
    <div class="room-header">
      <div><h3 style="margin:0;">${r.name}</h3>
      <span class="muted small">${r.members.length} members · Moderated by: ${r.moderators.length? r.moderators.join(', ') : 'no one yet (auto-filtered)'} · Peer support, not medical advice</span></div>
      <div class="row">
        ${modStatus(r.id,state.name)==='none' ? `<button class="btn btn-ghost btn-sm" onclick="go2ApplyModerate('${r.id}')">Apply to moderate</button>` : ''}
        <button class="btn btn-secondary btn-sm" onclick="startDm('${r.id}')">Contact ${r.moderators.length?'moderator':'admin'}</button>
      </div>
    </div>
    <div class="subtabs">
      <button class="${state.roomTab==='chat'?'active':''}" onclick="state.roomTab='chat';render();">Chat</button>
      <button class="${state.roomTab==='members'?'active':''}" onclick="state.roomTab='members';render();">Members (${r.members.length})</button>

function roomChatPane(r, showNudge, nudgeText){
  return `
    ${showNudge ? `<div class="banner banner-nudge" style="margin:14px 20px 0 20px;"><span class="prompt-text">Room prompt: "${nudgeText}"</span><button class="btn btn-sm btn-secondary" onclick="dismissNudge('${r.id}')">Dismiss</button></div>` : ''}
    <div class="msg-list" id="msgList">${r.messages.map(m=>messageBubble(r,m)).join('')}</div>
    <div id="blockedNotice"></div>
    <div class="composer"><textarea id="msgInput" rows="1" placeholder="Say what's on your mind..."></textarea><button class="btn btn-primary" onclick="sendMessage('${r.id}')">Send</button></div>`;
}
function messageBubble(r, m){
  const mine = m.who===state.name;
  const isStaff = r.moderators.includes(m.who);
  const flagKey = pairKey(state.name, m.id, 'msg');
  const alreadyFlagged = state.flaggedByMe.includes(flagKey);
  const flowOpen = state.msgFlagFlow && state.msgFlagFlow.roomId===r.id && state.msgFlagFlow.msgId===m.id;
  let flagUi = '';
  if(!mine){
    if(alreadyFlagged){
      flagUi = `<button class="msg-flag" disabled>Flagged — thanks</button>`;
    } else if(flowOpen){
      flagUi = `<span class="small" style="display:block;margin-top:6px;color:var(--danger);">Flag this message? <button class="btn btn-sm btn-danger" style="margin-left:6px;" onclick="confirmFlagMessage()">Confirm</button> <button class="btn btn-sm btn-secondary" onclick="cancelFlagMessageFlow()">Cancel</button></span>`;
    } else {
      flagUi = `<button class="msg-flag" onclick="openFlagMessageFlow('${r.id}',${m.id})">Flag this message</button>`;
    }
  }
  return `<div class="msg ${mine?'mine':''} ${(!mine&&isStaff)?'staff':''}">
    <span class="who">${mine?'You':m.who}${(!mine&&isStaff)?'<span class="mod-tag">Moderator</span>':''}</span>
    ${escapeHtml(m.text)}
    ${flagUi}
  </div>`;
}
function roomMembersPane(r){
  const q = (state.memberSearch||'').toLowerCase();
  const filtered = r.members.filter(m=>m.toLowerCase().includes(q));
  return `<div style="padding:16px 20px;">
    <input type="text" placeholder="Search members" value="${state.memberSearch}" oninput="state.memberSearch=this.value; render();">
    <p class="muted small" style="margin-top:12px;"><strong>Moderators (${r.moderators.length}/2):</strong> ${r.moderators.length? r.moderators.join(', ') : 'none yet'}</p>
    <div style="margin-top:8px;">${filtered.map(m=>memberRow(r,m)).join('')}</div>
  </div>`;
}
function memberRow(r, name){
  const isModHere = state.role==='moderator' && state.modRoomId===r.id;
  const isMe = name===state.name;
  const key = pairKey(state.name, name, r.id);
  const alreadyReported = state.reportedPairs.includes(key);
  const flowOpen = state.reportFlow && state.reportFlow.roomId===r.id && state.reportFlow.target===name;

  let reportUi = '';
  if(state.role==='user' && !isMe){
    if(alreadyReported){
      reportUi = `<span class="badge-reported" title="You already reported this member">Reported</span>`;
    } else if(flowOpen && state.reportFlow.step==='form'){
      reportUi = `<div class="report-box">
        <label for="reportReasonInput">Why are you reporting ${name}?</label>
        <textarea id="reportReasonInput" rows="2" placeholder="What happened?"></textarea>
        <div class="row" style="margin-top:8px;">
          <button class="btn btn-sm btn-danger" onclick="submitReportForm()">Submit report</button>
          <button class="btn btn-sm btn-secondary" onclick="cancelReportFlow()">Cancel</button>
        </div></div>`;
    } else if(flowOpen && state.reportFlow.step==='confirm'){
      reportUi = `<div class="confirm-box"><strong>Do you wish to confirm this report?</strong>
        <p class="small" style="margin:6px 0;">Reporting ${name}: "${escapeHtml(state.reportFlow.reason)}"</p>
        <div class="row"><button class="btn btn-sm btn-danger" onclick="confirmReport()">Confirm report</button>
        <button class="btn btn-sm btn-secondary" onclick="cancelReportFlow()">Cancel</button></div></div>`;
    } else {
      reportUi = `<button class="btn btn-sm btn-secondary" onclick="openReportUser('${r.id}','${name}')">Report member</button>`;
    }
  }
  const targetIsModerator = r.moderators.includes(name);
  const kickFlowOpen = state.kickFlow && state.kickFlow.roomId===r.id && state.kickFlow.target===name;
  let kickUi = '';
  if(isModHere && !isMe && targetIsModerator){
    kickUi = `<span class="muted small">Moderators can only be removed by the admin</span>`;
  } else if(isModHere && !isMe){
    if(kickFlowOpen && state.kickFlow.step==='form'){
      kickUi = `<div class="report-box">
        <label for="kickReasonInput">Reason for removing ${name} from the room</label>
        <textarea id="kickReasonInput" rows="2" placeholder="What happened?"></textarea>
        <div class="row" style="margin-top:8px;">
          <button class="btn btn-sm btn-danger" onclick="submitKickForm()">Continue</button>
          <button class="btn btn-sm btn-secondary" onclick="cancelKickFlow()">Cancel</button>
        </div></div>`;
    } else if(kickFlowOpen && state.kickFlow.step==='confirm'){
      kickUi = `<div class="confirm-box"><strong>Remove ${name} from this room?</strong>
        <p class="small" style="margin:6px 0;">Reason: "${escapeHtml(state.kickFlow.reason)}"</p>
        <div class="row"><button class="btn btn-sm btn-danger" onclick="confirmKick()">Confirm removal</button>
        <button class="btn btn-sm btn-secondary" onclick="cancelKickFlow()">Cancel</button></div></div>`;
    } else {
      kickUi = `<button class="btn btn-sm btn-danger" onclick="openKickUser('${r.id}','${name}')">Remove from room</button>`;
    }
  }
  return `<div class="member-row"><span>${name} ${targetIsModerator?'<span class="tag">moderator</span>':''}</span><div class="row">${reportUi}${kickUi}</div></div>`;
}
function openReportUser(roomId, name){
  const key = pairKey(state.name, name, roomId);
  if(state.reportedPairs.includes(key)) return;
  state.reportFlow = {roomId, target:name, step:'form', reason:''};
  render();
}
function submitReportForm(){
  const reason = document.getElementById('reportReasonInput').value.trim();
  if(!reason){ showToast("Please add a reason.", 'error'); return; }
  state.reportFlow.reason = reason; state.reportFlow.step = 'confirm';
  render();
}
function confirmReport(){
  const {roomId, target, reason} = state.reportFlow;
  const r = room(roomId);
  const isModerator = r.moderators.includes(target);
  if(isModerator){
    state.flaggedModerators.push({id:'fm'+nextId(), name:target, roomId, roomName:r.name, reason, reportedBy:state.name, status:'open'});
  } else {
    state.flaggedUsers.push({id:nextId(), roomId, roomName:r.name, reportedUser:target, reportedBy:state.name, reason, status:'open'});
  }
  state.reportedPairs.push(pairKey(state.name, target, roomId));
  state.reportFlow = null;
  render();
}
function cancelReportFlow(){ state.reportFlow=null; render(); }
function openKickUser(roomId, name){
  state.kickFlow = {roomId, target:name, step:'form', reason:''};
  render();
}
function submitKickForm(){
  const reason = document.getElementById('kickReasonInput').value.trim();
  if(!reason){ showToast("Please add a reason.", 'error'); return; }
  state.kickFlow.reason = reason; state.kickFlow.step = 'confirm';
  render();
}
function cancelKickFlow(){ state.kickFlow = null; render(); }
function confirmKick(){
  const {roomId, target, reason} = state.kickFlow;
  const r = room(roomId);
  r.members = r.members.filter(m=>m!==target);
  r.kickLog.push({name:target, reason, by:state.name});
  state.kickFlow = null;
  showToast(target + " was removed from " + r.name + ".", 'success');
  render();
}
function dismissNudge(id){ const r=room(id); r._nudgeShownFor=true; setTimeout(()=>{r._nudgeShownFor=false;},1); render(); }
async function sendMessage(roomId){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text) return;
  const r = room(roomId);
  const result = await classifyMessage(text);
  if(result.type === 'ok'){
    r.messages.push({who:state.name, text, id:nextId()});
    r.msgCount += 1; r._nudgeShownFor = false; input.value='';
    render();
  } else {
    state.flaggedMessages.push({id:nextId(), roomId, room:r.name, sender:state.name, text, reason:result.type, status:'held'});
    input.value=''; render();
    document.getElementById('blockedNotice').innerHTML = `<div class="banner banner-blocked" style="margin:0 20px 14px 20px;">
      <span>${result.message}</span>${result.type==='crisis' ? `<button class="btn btn-sm btn-secondary" onclick="startDm('${roomId}')">Message a moderator</button>` : ''}</div>`;
  }
}
function openFlagMessageFlow(roomId, msgId){
  const key = pairKey(state.name, msgId, 'msg');
  if(state.flaggedByMe.includes(key)) return;
  state.msgFlagFlow = {roomId, msgId};
  render();
}
function cancelFlagMessageFlow(){ state.msgFlagFlow = null; render(); }
function confirmFlagMessage(){
  if(!state.msgFlagFlow) return;
  const {roomId, msgId} = state.msgFlagFlow;
  const key = pairKey(state.name, msgId, 'msg');
  if(state.flaggedByMe.includes(key)){ state.msgFlagFlow = null; render(); return; }
  const r = room(roomId); const m = r.messages.find(x=>x.id===msgId);
  if(m){
    state.flaggedMessages.push({id:nextId(), roomId, room:r.name, sender:m.who, text:m.text, reason:'user-flagged', status:'held'});
    state.flaggedByMe.push(key);
  }
  state.msgFlagFlow = null;
  render();
}

/* ================= DM (topic-first) ================= */
function startDm(roomId){
  const existing = state.dmThreads.find(t=>t.roomId===roomId && t.userName===state.name && t.status==='open');
  if(existing){ state.dmRoomId = roomId; go('dmChat'); return; }
  state.dmRoomId = roomId; go('dmTopic');
}
function viewDmTopic(){
  const r = room(state.dmRoomId);
  return `<div class="stack" style="max-width:520px;margin:0 auto;">
    <span class="eyebrow">Contact ${r.moderators.length?'moderator':'admin'} — ${r.name}</span><h1>What's this about?</h1>
    <div class="stack">${DM_TOPICS.map(t=>`<button class="card" style="text-align:left;" onclick="pickDmTopic('${t.id}')"><strong style="color:var(--walnut-deep);">${t.label}</strong>${t.priority?'<div class="muted small">Flagged as priority for the moderator.</div>':''}</button>`).join('')}</div>
    <button class="btn btn-ghost" onclick="go('room')">Cancel</button>
  </div>`;
}
function pickDmTopic(topicId){
  const topic = DM_TOPICS.find(t=>t.id===topicId);
  const r = room(state.dmRoomId);
  const recipientType = r.moderators.length ? 'moderator' : 'admin';
  const thread = {id:nextId(), roomId:r.id, roomName:r.name, userName:state.name, recipientType, topic:topic.label, priority:topic.priority, status:'open', messages:[{who:'user', text:'(started a conversation: '+topic.label+')'},{who:'staff', text:topic.reply}]};
  state.dmThreads.push(thread);
  go('dmChat');
}
function viewDmChat(){
  const r = room(state.dmRoomId);
  const thread = state.dmThreads.find(t=>t.roomId===r.id && t.userName===state.name && t.status==='open');
  if(!thread) return `<p>No conversation yet. <button class="btn btn-secondary" onclick="startDm('${r.id}')">Start one</button></p>`;
  return `<div class="stack" style="max-width:560px;margin:0 auto;">
    <span class="eyebrow">${thread.recipientType==='moderator'?'Moderator':'Admin'} conversation — ${r.name}</span>
    ${thread.priority? `<span class="badge-priority">Marked priority</span>` : ''}
    <div class="room-window" style="min-height:320px;">
      <div class="msg-list">${thread.messages.map(m=>`<div class="msg ${m.who==='user'?'mine':'staff'}">${escapeHtml(m.text)}</div>`).join('')}</div>
      <div class="composer"><textarea id="dmInput" rows="1" placeholder="Type your message..."></textarea><button class="btn btn-primary" onclick="sendDmReply(${thread.id})">Send</button></div>
    </div><button class="btn btn-secondary" style="align-self:flex-start;" onclick="go('room')">Back to room</button>
  </div>`;
}
function sendDmReply(threadId){
  const input = document.getElementById('dmInput');
  const text = input.value.trim(); if(!text) return;
  const thread = state.dmThreads.find(t=>t.id===threadId);
  thread.messages.push({who:'user', text}); input.value=''; render();
}

function toggleEventTagFilter(t){ const i=state.eventTagFilter.indexOf(t); if(i>-1) state.eventTagFilter.splice(i,1); else state.eventTagFilter.push(t); render(); }

function toggleEvTag(btn){ btn.classList.toggle('selected'); }
function viewEventsPast(applyFilter, past){

      <div style="margin-top:10px;">

          <label class="btn btn-sm btn-secondary photo-upload-label" for="postPhoto-${e.id}">📷 Add a photo</label>
          <input type="file" accept="image/*" id="postPhoto-${e.id}" style="display:none;" onchange="handlePhotoSelect('${e.id}', this)">
          <span class="muted small" id="photoFileName-${e.id}"></span>
        </div>
        <div id="photoPreviewWrap-${e.id}"></div>
        <button class="btn btn-sm btn-primary" style="margin-top:8px;" onclick="addPastPost('${e.id}')">Post</button>

      </div></div>`).join('')}

function handlePhotoSelect(eventId, input){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast("Please choose an image file.", 'error'); input.value=''; return; }
  if(file.size > 5*1024*1024){ showToast("Please choose an image smaller than 5MB.", 'error'); input.value=''; return; }
  const reader = new FileReader();
  reader.onload = (ev)=>{
    state.pendingPhotos[eventId] = ev.target.result;
    const nameEl = document.getElementById('photoFileName-'+eventId);
    if(nameEl) nameEl.textContent = file.name;
    const wrap = document.getElementById('photoPreviewWrap-'+eventId);
    if(wrap) wrap.innerHTML = `<div class="photo-preview-wrap">
      <img src="${ev.target.result}" class="post-photo" alt="Preview of photo to share">
      <button type="button" class="photo-remove-btn" title="Remove photo" onclick="clearPendingPhoto('${eventId}')">✕</button>
    </div>`;
  };
  reader.onerror = ()=>{ showToast("Couldn't read that image — please try another one.", 'error'); };
  reader.readAsDataURL(file);
}
function clearPendingPhoto(eventId){
  delete state.pendingPhotos[eventId];
  const input = document.getElementById('postPhoto-'+eventId); if(input) input.value='';
  const nameEl = document.getElementById('photoFileName-'+eventId); if(nameEl) nameEl.textContent='';
  const wrap = document.getElementById('photoPreviewWrap-'+eventId); if(wrap) wrap.innerHTML='';
}
function pastPostCard(p){
  const reacted = p.reactions.includes(state.name);
  return `<div class="post-card"><strong>${p.author}</strong><p>${escapeHtml(p.text)}</p>
    ${p.photo? `<img src="${p.photo}" class="post-photo" alt="Photo shared by ${escapeHtml(p.author)}">`:''}
    <div class="row"><button class="react-btn ${reacted?'on':''}" onclick="toggleReaction('${p.id}')">♥ ${p.reactions.length} ${p.reactions.length===1?'like':'likes'}</button></div>
    <div style="margin-top:8px;">${p.comments.map(c=>`<p class="muted small"><strong>${c.author}:</strong> ${escapeHtml(c.text)}</p>`).join('')}
      <div class="row" style="margin-top:6px;"><input type="text" id="commentInput-${p.id}" placeholder="Add a comment" style="flex:1;"><button class="btn btn-sm btn-secondary" onclick="addComment('${p.id}')">Comment</button></div>
      <div id="commentNotice-${p.id}"></div>
    </div>
  </div>`;
}
function toggleReaction(postId){ const p=state.pastEventPosts.find(x=>x.id===postId); const i=p.reactions.indexOf(state.name); if(i>-1) p.reactions.splice(i,1); else p.reactions.push(state.name); render(); }
async function addComment(postId){
  const input = document.getElementById('commentInput-'+postId);
  const text = input.value.trim(); if(!text) return;
  const noticeEl = document.getElementById('commentNotice-'+postId);
  const result = await classifyMessage(text);
  if(result.type!=='ok'){
    input.value='';
    if(noticeEl) noticeEl.innerHTML = `<div class="banner banner-blocked" style="margin-top:8px;">${escapeHtml(result.message)}</div>`;
    return;
  }
  if(noticeEl) noticeEl.innerHTML = '';
  const p = state.pastEventPosts.find(x=>x.id===postId);
  p.comments.push({author:state.name, text}); render();
}
async function addPastPost(eventId){
  const text = document.getElementById('postText-'+eventId).value.trim();
  const photo = state.pendingPhotos[eventId] || null;
  if(!text){ showToast("Please write something to share.", 'error'); return; }
  const noticeEl = document.getElementById('postNotice-'+eventId);
  const result = await classifyMessage(text);
  if(result.type!=='ok'){
    if(noticeEl) noticeEl.innerHTML = `<div class="banner banner-blocked" style="margin-top:8px;">${escapeHtml(result.message)}</div>`;
    return;
  }
  if(noticeEl) noticeEl.innerHTML = '';
  state.pastEventPosts.push({id:'pp'+nextId(), eventId, author:state.name, text, photo, reactions:[], comments:[]});
  delete state.pendingPhotos[eventId];
  render();
}
function toggleRsvp(id){ const e=event_(id); const i=e.rsvpedBy.indexOf(state.name); if(i>-1) e.rsvpedBy.splice(i,1); else e.rsvpedBy.push(state.name); render(); }
function eventCard(e){
  const rsvped = e.rsvpedBy.includes(state.name);
  return `<div class="door-card"><div class="row">${e.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    <h3 style="margin-top:6px;">${e.title}</h3><p class="muted small">${e.date} · ${e.time}<br>${e.venue} · ${e.region}</p>
    <div class="row" style="justify-content:space-between;align-items:center;"><span class="muted small">${e.rsvpedBy.length} people going</span>
    <button class="btn btn-sm ${rsvped?'btn-secondary':'btn-primary'}" onclick="toggleRsvp('${e.id}')">${rsvped?'Cancel RSVP':'RSVP'}</button></div></div>`;
}
function proposeEvent(){
  const title = document.getElementById('evTitle').value.trim();
  const date = document.getElementById('evDate').value.trim();
  const time = document.getElementById('evTime').value.trim();
  const venue = document.getElementById('evVenue').value.trim();
  const region = document.getElementById('evRegion').value.trim();
  const tags = Array.from(document.querySelectorAll('#evTagRow .chip.selected')).map(b=>b.dataset.tag);
  if(!title || !date || !venue || tags.length===0){ showToast("Please fill in a title, date, public venue, and at least one type tag.", 'error'); return; }
  state.events.push({id:'e'+nextId(), title, tags, venue, region: region||'—', date, time: time||'—', status:'pending', isPast:false, rsvpedBy:[state.name], proposer:state.name});
  render();
}

/* ================= QUIZ ================= */
function viewQuiz(){
  if(!state.quiz.theme){
    return `<div class="stack"><div><span class="eyebrow">Quiz</span><h1>Pick a theme</h1>
      <p class="muted">Questions for each theme are generated once by a moderator and reused for everyone.</p></div>
      <div class="grid2">${Object.keys(state.quizThemes).map(t=>`<div class="door-card"><h3>${t}</h3><p class="muted">${state.quizThemes[t].length} questions · multiple choice</p><button class="btn btn-primary" onclick="startQuiz('${t}')">Play</button></div>`).join('')}</div>
    </div>`;
  }
  if(state.quiz.finished){
    const totalQ = state.quizThemes[state.quiz.theme].length;
    const board = [...state.leaderboardOthers, {name:state.name, score:state.quiz.score, you:true}].sort((a,b)=>b.score-a.score);
    const medals = ['🥇','🥈','🥉'];
    return `<div class="stack" style="max-width:520px;margin:0 auto;">
      <div class="door-card" style="text-align:center;"><h2>Nice playing, ${state.name}.</h2><p class="muted">You scored ${state.quiz.score} out of ${totalQ}.</p></div>
      <div class="door-card"><h3 style="text-align:center;">This round's leaderboard</h3>
        <div class="stack" style="gap:8px;margin-top:12px;">
          ${board.map((p,i)=>`<div class="lb-row ${i<3?'rank'+(i+1):''} ${p.you?'you':''}">
            <span class="lb-rank">${i+1}</span><span class="lb-medal">${medals[i]||''}</span>
            <span class="lb-name">${p.you? p.name+' (you)': p.name}</span>
            <span class="lb-score">${p.score} / ${totalQ}</span></div>`).join('')}
        </div>
        <p class="muted small" style="margin-top:10px;">This leaderboard resets with every new game. Nothing carries over between rounds.</p>
      </div>
      <button class="btn btn-secondary" onclick="resetQuiz()">Play another theme</button>
    </div>`;
  }
  const qs = state.quizThemes[state.quiz.theme]; const q = qs[state.quiz.index];
  return `<div class="stack" style="max-width:520px;margin:0 auto;">
    <span class="eyebrow">${state.quiz.theme} · Question ${state.quiz.index+1} of ${qs.length}</span>
    <div class="door-card"><h2>${q.q}</h2>
      <div style="margin-top:14px;">${q.options.map((opt,i)=>`<button class="quiz-option opt${i}" id="opt${i}" ${state.quiz.answered?'disabled':''} onclick="answerQuiz(${i})"><span class="opt-badge">${String.fromCharCode(65+i)}</span><span>${opt}</span></button>`).join('')}</div>
    </div></div>`;
}
function startQuiz(theme){ state.quiz = {theme, index:0, score:0, finished:false, answered:false}; render(); }
function answerQuiz(i){
  if(state.quiz.answered) return;
  const qs = state.quizThemes[state.quiz.theme]; const q = qs[state.quiz.index];
  state.quiz.answered = true;
  document.getElementById('opt'+q.answer).classList.add('correct');
  if(i!==q.answer) document.getElementById('opt'+i).classList.add('wrong'); else state.quiz.score += 1;
  setTimeout(()=>{
    if(state.quiz.index < qs.length-1){ state.quiz.index += 1; state.quiz.answered = false; } else { state.quiz.finished = true; }
    render();
  }, 900);
}
function resetQuiz(){ state.quiz = {theme:null, index:0, score:0, finished:false, answered:false}; render(); }

/* ================= MODERATOR DASHBOARD ================= */
function viewModDashboard(){
  const r = room(state.modRoomId);
  return `<div class="stack"><div><span class="eyebrow">Moderator dashboard</span><h1>${r.name}</h1></div>
    <div class="subtabs" style="background:var(--paper);border-radius:14px 14px 0 0;padding-top:14px;">
      <button class="${state.modTab==='chat'?'active':''}" onclick="state.modTab='chat';render();">Room chat</button>
      <button class="${state.modTab==='members'?'active':''}" onclick="state.modTab='members';render();">Members</button>
      <button class="${state.modTab==='messages'?'active':''}" onclick="state.modTab='messages';render();">Messages</button>
      <button class="${state.modTab==='flags'?'active':''}" onclick="state.modTab='flags';render();">Flags</button>
      <button class="${state.modTab==='quiz'?'active':''}" onclick="state.modTab='quiz';render();">Generate quiz</button>
    </div>
    <div class="door-card" style="border-radius:0 0 16px 16px;border-top:none;">
      ${state.modTab==='chat' ? modChatTab(r) : state.modTab==='members' ? roomMembersPane(r) : state.modTab==='messages' ? modMessagesTab(r) : state.modTab==='flags' ? modFlagsTab(r) : modQuizTab()}
    </div></div>`;
}
function modChatTab(r){
  return `<div class="msg-list" style="max-height:360px;">${r.messages.map(m=>messageBubble(r,m)).join('')}</div>
  <div class="composer"><textarea id="modMsgInput" rows="1" placeholder="Say something to the room..."></textarea><button class="btn btn-primary" onclick="sendModMessage('${r.id}')">Send</button></div>`;
}
function sendModMessage(roomId){
  const input = document.getElementById('modMsgInput');
  const text = input.value.trim(); if(!text) return;
  const r = room(roomId);
  r.messages.push({who:state.name, text, id:nextId()});
  r.msgCount += 1; input.value='';
  render();
}
function modMessagesTab(r){
  const threads = state.dmThreads.filter(t=>t.roomId===r.id).sort((a,b)=>(b.priority-a.priority));
  if(threads.length===0) return `<p class="muted">No messages from members yet.</p>`;
  return `<div class="stack">${threads.map(t=>`<div class="banner ${t.priority?'banner-priority':'banner-info'}">
    <div><strong>${t.userName}</strong> ${t.priority?'<span class="badge-priority">Priority</span>':''}<div class="small">${t.topic}</div></div>
    <button class="btn btn-sm btn-secondary" onclick="openModThread(${t.id})">Open</button></div>`).join('')}</div>
  <div id="modThreadView" style="margin-top:16px;"></div>`;
}
function openModThread(threadId){
  const t = state.dmThreads.find(x=>x.id===threadId);
  document.getElementById('modThreadView').innerHTML = `<div class="room-window" style="min-height:220px;">
    <div class="msg-list">${t.messages.map(m=>`<div class="msg ${m.who==='staff'?'staff':''}">${escapeHtml(m.text)}</div>`).join('')}</div>
    <div class="composer"><textarea id="modReplyInput" rows="1" placeholder="Reply..."></textarea><button class="btn btn-primary" onclick="sendModReply(${t.id})">Send</button></div></div>`;
}
function sendModReply(threadId){
  const input = document.getElementById('modReplyInput');
  const text = input.value.trim(); if(!text) return;
  const t = state.dmThreads.find(x=>x.id===threadId);
  t.messages.push({who:'staff', text}); input.value=''; openModThread(threadId);
}
function modFlagsTab(r){
  const msgs = state.flaggedMessages.filter(f=>f.roomId===r.id);
  const users = state.flaggedUsers.filter(f=>f.roomId===r.id && f.status==='open');
  return `<h3>Flagged messages</h3>
  ${msgs.length===0? `<p class="muted small">Nothing flagged right now.</p>` : msgs.map(f=>`
    <div class="flag-warning"><span class="icon">⚠️</span><div style="flex:1;">
      <span class="tag">${f.reason}</span> from ${f.sender}
      <div class="muted small" style="margin-top:4px;">"${escapeHtml(f.text)}"</div>
      <div class="row" style="margin-top:8px;">
        <button class="btn btn-sm btn-secondary" onclick="resolveFlag(${f.id},'released')">Release to room</button>
        <button class="btn btn-sm btn-danger" onclick="resolveFlag(${f.id},'kept')">Keep held</button>
      </div></div></div>`).join('')}
  <h3 style="margin-top:18px;">Reported members</h3>
  ${users.length===0? `<p class="muted small">No open reports.</p>` : users.map(f=>`
    <div class="flag-warning"><span class="icon">⚠️</span><div style="flex:1;">
      <strong>${f.reportedUser}</strong> reported by ${f.reportedBy}
      <div class="muted small" style="margin-top:4px;">${escapeHtml(f.reason)}</div>
      <div class="row" style="margin-top:8px;">
        <button class="btn btn-sm btn-danger" onclick="resolveUserFlag(${f.id},'remove')">Remove from room</button>
        <button class="btn btn-sm btn-secondary" onclick="resolveUserFlag(${f.id},'dismiss')">Dismiss</button>
      </div></div></div>`).join('')}`;
}
function resolveFlag(id, outcome){
  const f = state.flaggedMessages.find(x=>x.id===id);
  if(!f){ console.warn('resolveFlag: no flagged message found for id', id); return; }
  if(outcome==='released'){ const r=room(f.roomId); if(r){ r.messages.push({who:f.sender, text:f.text, id:nextId()}); r.msgCount+=1; } }
  state.flaggedMessages = state.flaggedMessages.filter(x=>x.id!==id);
  render();
}
function resolveUserFlag(id, outcome){
  const f = state.flaggedUsers.find(x=>x.id===id);
  if(!f){ console.warn('resolveUserFlag: no flagged user found for id', id); return; }
  if(outcome==='remove'){ const r=room(f.roomId); r.members = r.members.filter(m=>m!==f.reportedUser); r.kickLog.push({name:f.reportedUser, reason:f.reason, by:'moderator (via report)'}); }
  f.status='resolved';
  render();
}
function modQuizTab(){
  return `<h3>Generate a quiz for members</h3>
  <p class="muted small">Type a theme. Haven asks OpenAI to write 5 multiple-choice questions once, and everyone reuses them from then on. If the local server isn't running or has no API key configured yet, this falls back to a small pre-written question bank so the demo still works — check the browser console for which path was used.</p>
  <div class="field"><label for="quizThemeInput">Theme</label><input type="text" id="quizThemeInput" placeholder="e.g. Kerala History"></div>
  <button class="btn btn-primary" id="genQuizBtn" onclick="generateModQuiz()">Generate quiz</button>
  <div id="quizGenStatus" class="muted small" style="margin-top:10px;"></div>
  <h3 style="margin-top:20px;">Quizzes available to members</h3>
  <div class="stack">${Object.keys(state.quizThemes).map(t=>`<div class="row" style="justify-content:space-between;"><span>${t}</span><span class="muted small">${state.quizThemes[t].length} questions</span></div>`).join('')}</div>`;
}
async function generateModQuiz(){
  const theme = document.getElementById('quizThemeInput').value.trim();
  if(!theme){ showToast("Please enter a theme.", 'error'); return; }
  if(state.quizThemes[theme]){ showToast("A quiz with this exact theme name already exists.", 'error'); return; }
  const statusEl = document.getElementById('quizGenStatus');
  const btn = document.getElementById('genQuizBtn');
  statusEl.textContent = 'Generating with OpenAI...';
  btn.disabled = true;
  try{
    const res = await fetch('/api/quiz', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({theme})
    });
    if(!res.ok) throw new Error('server responded with ' + res.status);
    const data = await res.json();
    if(!Array.isArray(data.questions) || data.questions.length===0) throw new Error('no questions returned');
    state.quizThemes[theme] = data.questions;
    statusEl.textContent = 'Generated with OpenAI.';
  } catch(err){
    console.warn('AI quiz generation unavailable (is the local server running with a valid key?) — using the local demo template instead:', err.message);
    const idx = Object.keys(state.quizThemes).length % MOD_GENERATION_TEMPLATES.length;
    state.quizThemes[theme] = MOD_GENERATION_TEMPLATES[idx].qs;
    statusEl.textContent = 'AI generation unavailable — used a local demo question bank instead.';
  }
  render();
}

/* ================= ADMIN DASHBOARD ================= */
function viewAdminDashboard(){
  return `<div class="stack"><div><span class="eyebrow">Admin dashboard</span><h1>Keeping Haven steady, platform-wide</h1></div>
    <div class="subtabs" style="background:var(--paper);border-radius:14px 14px 0 0;padding-top:14px;">
      <button class="${state.adminTab==='applications'?'active':''}" onclick="state.adminTab='applications';render();">Moderator applications</button>
      <button class="${state.adminTab==='events'?'active':''}" onclick="state.adminTab='events';render();">Pending events</button>
      <button class="${state.adminTab==='flags'?'active':''}" onclick="state.adminTab='flags';render();">Flagged moderators</button>
      <button class="${state.adminTab==='messages'?'active':''}" onclick="state.adminTab='messages';render();">Unmoderated-room messages</button>
      <button class="${state.adminTab==='directory'?'active':''}" onclick="state.adminTab='directory';render();">Room directory</button>
    </div>
    <div class="door-card" style="border-radius:0 0 16px 16px;border-top:none;">
      ${state.adminTab==='applications' ? adminApplicationsTab() : state.adminTab==='events' ? adminEventsTab() : state.adminTab==='flags' ? adminFlagsTab() : state.adminTab==='messages' ? adminMessagesTab() : adminDirectoryTab()}
    </div></div>`;
}
function adminApplicationsTab(){
  const pending = state.moderatorApplications.filter(a=>a.status==='pending');
  return `<h3>Pending moderator applications</h3>
  ${pending.length===0? `<p class="muted">Nothing waiting right now.</p>` : pending.map(a=>{
    const r = room(a.roomId); const full = r.moderators.length>=2;
    return `<div style="border-bottom:1px solid var(--line);padding:12px 0;">
      <strong>${a.applicantName}</strong> applying for <strong>${a.roomName}</strong> (${r.moderators.length}/2 slots filled)
      <p class="muted small">${escapeHtml(a.description)}</p>
      ${a.recentMessages && a.recentMessages.length? `<p class="muted small">Recent messages: ${a.recentMessages.map(m=>'"'+escapeHtml(m)+'"').join(', ')}</p>`:''}
      ${full? `<p class="muted small" style="color:var(--danger);">This room already has 2 moderators.</p>`:''}
      <div class="row" style="margin-top:6px;"><button class="btn btn-sm btn-primary" ${full?'disabled':''} onclick="approveApplication('${a.id}')">Approve</button>
      <button class="btn btn-sm btn-secondary" onclick="denyApplication('${a.id}')">Decline</button></div></div>`;
  }).join('')}
  <h3 style="margin-top:20px;">Issued moderator keys (demo reference)</h3>
  ${state.issuedKeysLog.length===0? `<p class="muted small">None issued yet.</p>` : `<div class="stack">${state.issuedKeysLog.map(k=>`<div class="row" style="justify-content:space-between;"><span>${k.name} — ${k.roomName}</span><code>${k.key}</code></div>`).join('')}</div>`}`;
}
function approveApplication(id){
  const a = state.moderatorApplications.find(x=>x.id===id);
  const r = room(a.roomId);
  if(r.moderators.length>=2){ showToast("This room already has 2 moderators.", 'error'); return; }
  r.moderators.push(a.applicantName);
  if(!r.members.includes(a.applicantName)) r.members.push(a.applicantName);
  const key = 'HVN-' + Math.floor(1000+Math.random()*9000);
  state.moderatorKeys.push({key, roomId:r.id, name:a.applicantName});
  state.issuedKeysLog.push({name:a.applicantName, roomName:r.name, key});
  a.status='approved';
  showToast(a.applicantName + " approved as moderator of " + r.name + " (now " + r.moderators.length + "/2). Key: " + key + " — also saved below under Issued moderator keys.", 'success', 8000);
  render();
}
function denyApplication(id){ const a = state.moderatorApplications.find(x=>x.id===id); a.status='denied'; render(); }
function adminEventsTab(){
  const pending = state.events.filter(e=>e.status==='pending');
  return `<h3>Pending events — public venue check</h3>
  ${pending.length===0? `<p class="muted">No events waiting for approval.</p>` : pending.map(e=>`
    <div style="border-bottom:1px solid var(--line);padding:10px 0;">
      <strong>${e.title}</strong> — proposed by ${e.proposer} <span class="tag">${e.tags.join(', ')}</span>
      <div class="muted small">${e.date} · ${e.time} · Venue: ${e.venue} (${e.region})</div>
      <div class="row" style="margin-top:8px;"><button class="btn btn-sm btn-primary" onclick="handleEvent('${e.id}',true)">Approve — venue is public</button>
      <button class="btn btn-sm btn-secondary" onclick="handleEvent('${e.id}',false)">Reject</button></div></div>`).join('')}`;
}
function handleEvent(id, approve){
  const e = event_(id);
  if(approve){ e.status='approved'; }
  else state.events = state.events.filter(x=>x.id!==id);
  render();
}
function adminFlagsTab(){
  const open = state.flaggedModerators.filter(m=>m.status==='open');
  return `<h3>Flagged moderators</h3><p class="muted small">Reports about moderators route here, to the admin, not to the room's own moderator.</p>
  ${open.length===0? `<p class="muted">No open reports.</p>` : open.map(m=>`
    <div class="flag-warning"><span class="icon">⚠️</span><div style="flex:1;">
      <strong>${m.name}</strong> — ${m.roomName}
      <div class="muted small" style="margin-top:4px;">Reason: ${escapeHtml(m.reason)} · Reported by ${m.reportedBy}</div>
      <div class="row" style="margin-top:8px;"><button class="btn btn-sm btn-secondary" onclick="dismissModFlag('${m.id}')">Dismiss report</button>
      <button class="btn btn-sm btn-danger" onclick="removeModerator('${m.id}')">Remove moderator access</button></div></div></div>`).join('')}`;
}
function dismissModFlag(id){ const m = state.flaggedModerators.find(x=>x.id===id); m.status='resolved'; render(); }
function removeModerator(id){
  const m = state.flaggedModerators.find(x=>x.id===id);
  const r = room(m.roomId);
  r.moderators = r.moderators.filter(n=>n!==m.name);
  state.moderatorKeys = state.moderatorKeys.filter(k=>!(k.roomId===m.roomId && k.name===m.name));
  m.status='resolved';
  showToast(m.name + " has been removed as moderator of " + r.name + ". This room now has " + r.moderators.length + "/2 moderators.", 'success');
  render();
}
function adminMessagesTab(){
  const threads = state.dmThreads.filter(t=>t.recipientType==='admin').sort((a,b)=>(b.priority-a.priority));
  if(threads.length===0) return `<p class="muted">No messages routed to admin. These appear when a user contacts a room that has no moderator assigned yet.</p>`;
  return `<div class="stack">${threads.map(t=>`<div class="banner ${t.priority?'banner-priority':'banner-info'}">
    <div><strong>${t.userName}</strong> — ${t.roomName} ${t.priority?'<span class="badge-priority">Priority</span>':''}<div class="small">${t.topic}</div></div>
    <button class="btn btn-sm btn-secondary" onclick="openModThread(${t.id})">Open</button></div>`).join('')}</div>
  <div id="modThreadView" style="margin-top:16px;"></div>`;
}
function adminDirectoryTab(){
  return `<h3>All rooms</h3><div class="stack">${state.rooms.map(r=>`
    <div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0;">
      <div><strong>${r.name}</strong><div class="muted small">${r.members.length} members · ${r.tags.join(', ')}</div></div>
      <div class="muted small">${r.moderators.length}/2 moderators: ${r.moderators.join(', ') || 'none'}</div>
    </div>`).join('')}</div>`;
}

/* ---------------- boot ---------------- */
render();
</script>
</body>
</html>
